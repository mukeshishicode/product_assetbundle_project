# This is a Databricks asset bundle definition for product_assetbundle_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: product_assetbundle_project
  uuid: 68003e4d-e790-48ad-8a1c-2d5668f57623

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f4b88df4-813c.cloud.databricks.com
    variables:
      catalog: dev_asset_catalog
      schema: dev_schema
  prod:
    mode: production
    workspace:
      host: https://dbc-f4b88df4-813c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mukeshishi1991@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mukeshishi1991@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_asset_catalog
      schema: prod_schema
    permissions:
      - user_name: mukeshishi1991@gmail.com
        level: CAN_MANAGE
